<svg width="700" height="940" viewBox="0 0 700 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MarketDrive AI agent workflow">
  <title>MarketDrive AI — agent workflow</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#4a4a4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ================= Connectors ================= -->
  <line x1="350" y1="74"  x2="350" y2="106" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="350" y1="170" x2="350" y2="202" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="350" y1="270" x2="350" y2="302" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="350" y1="370" x2="350" y2="402" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="350" y1="470" x2="350" y2="502" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Fork into Risk / RAG -->
  <path d="M350 566 V590 H200 V606" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M350 566 V590 H500 V606" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Merge into FastAPI -->
  <path d="M200 676 V716 H350 V752" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M500 676 V716 H350 V752" fill="none" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="350" y1="812" x2="350" y2="848" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= Flow dots ================= -->
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.4s" begin="0s"   repeatCount="indefinite" path="M350 74 V106"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.4s" begin="0.2s" repeatCount="indefinite" path="M350 170 V202"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.4s" begin="0.4s" repeatCount="indefinite" path="M350 270 V302"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.4s" begin="0.6s" repeatCount="indefinite" path="M350 370 V402"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.4s" begin="0.8s" repeatCount="indefinite" path="M350 470 V502"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.6s" begin="1.0s" repeatCount="indefinite" path="M350 566 V590 H200 V606"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.6s" begin="1.0s" repeatCount="indefinite" path="M350 566 V590 H500 V606"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M200 676 V716 H350 V752"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M500 676 V716 H350 V752"/></circle>
  <circle r="3.2" fill="#4a4a4a"><animateMotion dur="1.4s" begin="1.4s" repeatCount="indefinite" path="M350 812 V848"/></circle>

  <!-- ================= Nodes ================= -->

  <!-- Entry -->
  <rect x="190" y="20" width="320" height="54" rx="10" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.4"/>
  <text x="350" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Cron trigger · 09:15 IST</text>
  <text x="350" y="60" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">or manual / event-driven request</text>

  <!-- Coordinator (entry) -->
  <rect x="190" y="106" width="320" height="64" rx="10" fill="#f2f2f2" stroke="#2c2c2c" stroke-width="1.4"/>
  <text x="350" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">LangGraph coordinator</text>
  <text x="350" y="149" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">stateful orchestration graph</text>

  <!-- News agent -->
  <rect x="190" y="202" width="320" height="68" rx="10" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.4"/>
  <circle cx="222" cy="223" r="13" fill="#2c2c2c"/>
  <text x="222" y="227" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="244" y="227" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">News agent</text>
  <text x="350" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">MarketAux + Groq — sentiment &amp; event scoring</text>

  <!-- Market agent -->
  <rect x="190" y="302" width="320" height="68" rx="10" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.4"/>
  <circle cx="222" cy="323" r="13" fill="#2c2c2c"/>
  <text x="222" y="327" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="244" y="327" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Market agent</text>
  <text x="350" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">OHLCV + technicals — RSI, MACD, EMA, ATR</text>

  <!-- Prediction agent -->
  <rect x="190" y="402" width="320" height="68" rx="10" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.4"/>
  <circle cx="222" cy="423" r="13" fill="#2c2c2c"/>
  <text x="222" y="427" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="244" y="427" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Prediction agent</text>
  <text x="350" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">XGBoost + SHAP — walk-forward CV</text>

  <!-- Coordinator (conflict / confidence) -->
  <rect x="190" y="502" width="320" height="64" rx="10" fill="#f2f2f2" stroke="#2c2c2c" stroke-width="1.4"/>
  <text x="350" y="526" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Coordinator node</text>
  <text x="350" y="545" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">conflict detection · confidence calibration</text>

  <!-- Risk agent -->
  <rect x="60" y="606" width="280" height="70" rx="10" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.4"/>
  <circle cx="92" cy="628" r="13" fill="#2c2c2c"/>
  <text x="92" y="632" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="114" y="632" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Risk agent</text>
  <text x="200" y="655" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">ATR corridors · volatility regime</text>

  <!-- RAG agent -->
  <rect x="360" y="606" width="280" height="70" rx="10" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.4"/>
  <circle cx="392" cy="628" r="13" fill="#2c2c2c"/>
  <text x="392" y="632" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="414" y="632" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">RAG agent</text>
  <text x="500" y="655" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">FAISS + Groq — analyst explanations</text>

  <!-- FastAPI -->
  <rect x="190" y="752" width="320" height="60" rx="10" fill="#f2f2f2" stroke="#2c2c2c" stroke-width="1.4"/>
  <text x="350" y="776" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">FastAPI REST layer</text>
  <text x="350" y="794" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">MongoDB cache · state sync</text>

  <!-- UI -->
  <rect x="190" y="848" width="320" height="60" rx="10" fill="#ffffff" stroke="#2c2c2c" stroke-width="1.4"/>
  <text x="350" y="872" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">React + Vite dashboard</text>
  <text x="350" y="890" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5a5a5a">Vercel deployment</text>

</svg>
